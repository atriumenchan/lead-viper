<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Dashboard — AI Lead Engine</title>
  <link rel="icon" href="/favicon.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root{
      --bg-app:#0F172A; --bg-surface:#172033; --bg-card:#1B2438; --bg-elevated:#212D46;
      --text-primary:#F8FAFC; --text-secondary:#CBD5E1; --text-muted:#94A3B8; --text-disabled:#64748B;
      --accent:#4F46E5; --accent-hover:#6366F1;
      --success:#22C55E; --warning:#F59E0B; --error:#EF4444;
      --border:rgba(255,255,255,0.08); --border-hover:rgba(79,70,229,0.45);
      --radius:18px; --radius-sm:12px; --radius-xs:8px;
      --shadow:0 2px 8px rgba(0,0,0,0.12); --shadow-hover:0 8px 28px rgba(0,0,0,0.22);
      --transition:220ms cubic-bezier(0.4,0,0.2,1);
      --font:'Inter',system-ui,-apple-system,sans-serif;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;background:var(--bg-app);font-family:var(--font);color:var(--text-primary);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}

    ::-webkit-scrollbar{width:8px;height:8px}
    ::-webkit-scrollbar-track{background:var(--bg-app)}
    ::-webkit-scrollbar-thumb{background:var(--bg-elevated);border-radius:4px}
    ::-webkit-scrollbar-thumb:hover{background:#2d3a56}

    /* ── Header ── */
    header{background:var(--bg-surface);border-bottom:1px solid var(--border);height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 40px;position:sticky;top:0;z-index:100}
    .logo{display:flex;align-items:center;gap:10px}
    .logo-icon{width:32px;height:32px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px}
    .logo-text{font-weight:600;font-size:15px;color:var(--text-primary);line-height:1.2}
    .logo-sub{font-size:10px;font-weight:500;color:var(--text-muted);letter-spacing:.1em;text-transform:uppercase}
    .hdr-right{display:flex;align-items:center;gap:14px}
    .hdr-back{font-size:15px;font-weight:500;color:var(--text-secondary);cursor:pointer;display:flex;align-items:center;gap:8px;background:var(--bg-elevated);border:1px solid var(--border);padding:10px 18px;border-radius:var(--radius-xs);transition:var(--transition);min-height:40px}
    .hdr-back:hover{color:var(--text-primary);border-color:var(--border-hover);background:var(--bg-card)}
    .hdr-avatar{width:32px;height:32px;border-radius:50%;background:var(--bg-elevated);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--text-secondary);flex-shrink:0}
    .hdr-email{font-size:14px;color:var(--text-muted)}
    .signout{background:none;border:none;font-size:14px;color:var(--text-muted);cursor:pointer;display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--radius-xs);transition:var(--transition);min-height:40px}
    .signout:hover{color:var(--text-primary);background:var(--bg-elevated)}

    /* ── Main ── */
    main{max-width:1440px;margin:0 auto;padding:64px 48px}

    /* ── Animations ── */
    @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    .fade-in{animation:fadeIn .3s ease-out}

    /* ── Hero ── */
    .hero{margin-bottom:64px}
    .hero-greeting{font-size:14px;font-weight:600;color:var(--text-secondary);margin-bottom:8px}
    .hero h1{font-weight:700;font-size:38px;line-height:1.25;color:var(--text-primary);margin-bottom:16px}
    .hero-sub{font-size:16px;color:var(--text-secondary);line-height:1.65;max-width:620px;margin-bottom:32px}
    .hero-stats{display:flex;gap:40px;flex-wrap:wrap}
    .hero-stat{display:flex;flex-direction:column;gap:4px}
    .hero-stat-num{font-weight:700;font-size:28px;color:var(--text-primary)}
    .hero-stat-lbl{font-size:13px;font-weight:600;color:var(--text-secondary)}

    /* ── Roadmap banner ── */
    .roadmap-card{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px 32px;margin-bottom:64px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}
    .roadmap-left{display:flex;align-items:center;gap:20px}
    .roadmap-icon{width:48px;height:48px;background:var(--accent);border:1px solid var(--border);border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff}
    .roadmap-card h3{font-weight:600;font-size:17px;color:var(--text-primary);margin-bottom:4px}
    .roadmap-card p{font-size:15px;color:var(--text-secondary);line-height:1.55}

    /* ── Buttons (unified) ── */
    .btn-primary{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;font-size:15px;font-weight:600;padding:12px 24px;border:none;border-radius:var(--radius-xs);cursor:pointer;text-decoration:none;transition:var(--transition);min-height:44px}
    .btn-primary:hover{background:var(--accent-hover)}
    .btn-secondary{display:inline-flex;align-items:center;gap:8px;background:transparent;color:var(--text-secondary);font-size:15px;font-weight:500;padding:12px 24px;border:1px solid var(--border);border-radius:var(--radius-xs);cursor:pointer;text-decoration:none;transition:var(--transition);min-height:44px}
    .btn-secondary:hover{border-color:var(--border-hover);color:var(--text-primary);background:var(--bg-elevated)}

    /* ── Section headers ── */
    .sec-header{margin-bottom:32px}
    .sec-title{font-weight:600;font-size:22px;color:var(--text-primary);margin-bottom:8px}
    .sec-desc{font-size:15px;color:var(--text-secondary);line-height:1.55}

    /* ── Card grid ── */
    .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:32px;margin-bottom:64px}

    /* ── Cards ── */
    .card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:var(--transition);display:flex;flex-direction:column;text-decoration:none;box-shadow:var(--shadow)}
    .card:hover{border-color:var(--border-hover);transform:translateY(4px);box-shadow:var(--shadow-hover)}
    .card:hover .card-thumb img{transform:scale(1.02)}
    .card.locked{cursor:default}
    .card.locked .card-thumb,.card.locked .card-body{pointer-events:none}
    .card.locked a.card-cta{pointer-events:auto;cursor:pointer}
    .card.locked .card-thumb img{filter:none}
    .card.locked .card-title{color:var(--text-primary)}
    .card.locked .card-desc{color:var(--text-secondary)}
    .card-thumb{width:100%;height:220px;position:relative;overflow:hidden;background:var(--bg-elevated)}
    .card-thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s ease}

    /* ── Card placeholder (no image) ── */
    .card-placeholder{width:100%;height:220px;display:flex;align-items:center;justify-content:center;background:var(--bg-elevated);border-bottom:1px solid var(--border)}
    .card-placeholder svg{color:var(--text-muted);opacity:1}

    .card-badge{position:absolute;top:12px;right:12px;background:var(--bg-app);color:var(--text-secondary);font-size:11px;font-weight:700;padding:4px 10px;border-radius:6px;letter-spacing:.04em;text-transform:uppercase;z-index:2;border:1px solid var(--border)}
    .card-badge.locked-badge{color:var(--text-secondary)}

    .card-body{padding:24px;flex:1;display:flex;flex-direction:column}
    .card-title{font-weight:600;font-size:18px;color:var(--text-primary);margin-bottom:16px;line-height:1.35}
    .card-desc{font-size:15px;color:var(--text-secondary);line-height:1.6;margin-bottom:20px;flex:1}
    .card-meta{display:flex;gap:20px;margin-bottom:20px;flex-wrap:wrap}
    .card-meta-item{font-size:13px;color:var(--text-secondary);display:flex;align-items:center;gap:5px}
    .card-cta{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#fff;font-size:15px;font-weight:600;padding:10px 20px;border-radius:var(--radius-xs);text-decoration:none;transition:var(--transition);min-height:40px;align-self:flex-start}
    .card:hover .card-cta{background:var(--accent-hover)}
    .card-cta.dim{background:var(--accent);color:#fff;cursor:default;opacity:1}

    /* ── Block view ── */
    .block-header{margin-bottom:40px}
    .block-crumb{font-size:13px;font-weight:600;color:var(--text-secondary);display:flex;align-items:center;gap:6px;margin-bottom:12px}
    .block-title{font-weight:700;font-size:32px;margin-bottom:12px;color:var(--text-primary);line-height:1.25}
    .block-sub{font-size:16px;color:var(--text-secondary);margin-bottom:20px;line-height:1.55}
    .folder-count{font-size:14px;color:var(--text-secondary);display:flex;align-items:center;gap:6px}
    .folder-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
    .folder-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:20px;cursor:pointer;display:flex;align-items:center;gap:14px;transition:var(--transition)}
    .folder-card:hover{border-color:var(--border-hover);background:var(--bg-elevated)}
    .folder-icon{width:40px;height:40px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--text-secondary)}
    .folder-name{font-size:15px;font-weight:600;color:var(--text-primary);line-height:1.35}

    /* ── Lesson view ── */
    .lesson-wrap{max-width:800px}
    .lesson-crumb{font-size:13px;font-weight:600;color:var(--text-secondary);display:flex;align-items:center;gap:6px;margin-bottom:12px}
    .lesson-title{font-weight:700;font-size:32px;margin-bottom:12px;color:var(--text-primary);line-height:1.25}
    .lesson-sub{font-size:16px;color:var(--text-secondary);margin-bottom:32px;line-height:1.55}
    .lesson-body-plain{font-size:16px;color:var(--text-secondary);line-height:1.8;white-space:pre-wrap;margin-bottom:12px}
    .coach-list{margin:24px 0;padding:0;list-style:none;columns:2;gap:20px}
    .coach-list li{font-size:15px;color:var(--text-secondary);padding:3px 0}
    .coach-list li::before{content:'\2014\0020';color:var(--text-secondary)}
    .more-text{font-size:16px;color:var(--text-secondary);margin-bottom:28px}
    .res-title{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary);display:flex;align-items:center;gap:6px;margin-bottom:16px}
    .res-icon{width:44px;height:44px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--text-secondary)}
    .res-info .res-name{font-size:15px;font-weight:600;color:var(--text-primary)}
    .coming-soon{font-size:15px;color:var(--text-secondary);font-style:italic}
    .lc-h2{font-weight:600;font-size:18px;color:var(--text-primary);margin:24px 0 8px;padding-top:4px}
    .lc-p{font-size:16px;color:var(--text-secondary);line-height:1.8;margin:4px 0}
    .lc-bq{border-left:3px solid var(--accent);padding:12px 18px;background:var(--bg-surface);border-radius:0 var(--radius-xs) var(--radius-xs) 0;margin:8px 0;font-size:15px;color:var(--text-secondary);line-height:1.7;font-style:italic}
    .lc-li{font-size:15px;color:var(--text-secondary);padding:3px 0 3px 20px;line-height:1.7;display:block;position:relative}
    .lc-li::before{content:'\2022';color:var(--text-secondary);position:absolute;left:0;font-size:18px}
    .lc-hr{border:none;border-top:1px solid var(--border);margin:20px 0}
    .lesson-body{font-size:16px;color:var(--text-secondary);line-height:1.8;margin-bottom:12px}

    /* ── Bump resource cards ── */
    .bump-resources{display:flex;flex-direction:column;gap:20px;max-width:800px}
    .bump-res-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:28px;transition:var(--transition)}
    .bump-res-card:hover{border-color:var(--border-hover)}
    .bump-res-name{font-weight:600;font-size:18px;color:var(--text-primary);margin-bottom:10px}
    .bump-res-desc{font-size:15px;color:var(--text-secondary);line-height:1.7;margin-bottom:20px}
    .bump-res-btn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;font-size:15px;font-weight:600;padding:12px 24px;border-radius:var(--radius-xs);text-decoration:none;transition:var(--transition);min-height:44px}
    .bump-res-btn:hover{background:var(--accent-hover)}

    /* ── Golden Bonus Roadmap Section ── */
    .bonus-roadmap{position:relative;margin-bottom:64px;border-radius:var(--radius);overflow:hidden;background:#d4af37;border:1px solid #b8941f;box-shadow:0 8px 32px rgba(212,175,55,0.3)}
    .bonus-roadmap-glow{display:none}
    .bonus-roadmap-content{position:relative;padding:48px 40px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px}
    .bonus-crown{color:#1a1407;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.2))}
    .bonus-label{font-size:11px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:#1a1407;padding:4px 16px;border:1px solid rgba(26,20,7,0.3);border-radius:20px;background:rgba(26,20,7,0.06)}
    .bonus-title{font-weight:700;font-size:28px;color:#1a1407;line-height:1.3;margin:4px 0}
    .bonus-desc{font-size:16px;color:#3d2c12;line-height:1.65;max-width:560px;margin-bottom:8px}
    .bonus-btn{display:inline-flex;align-items:center;gap:8px;background:#1a1407;color:#d4af37;font-size:16px;font-weight:700;padding:14px 32px;border-radius:8px;text-decoration:none;transition:all .3s ease;min-height:48px;border:1px solid #1a1407;box-shadow:0 4px 16px rgba(0,0,0,0.2);letter-spacing:.02em}
    .bonus-btn:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(0,0,0,0.3);background:#2d1f0a}

    /* ── Vault section ── */
    .vault-section{margin-top:24px}
    .vault-header{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius);padding:32px;margin-bottom:32px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}
    .vault-header-left{flex:1;min-width:280px}
    .vault-header h2{font-weight:700;font-size:24px;color:var(--text-primary);margin-bottom:8px}
    .vault-header p{font-size:15px;color:var(--text-secondary);line-height:1.55}
    .vault-badge{display:inline-block;font-size:12px;font-weight:600;padding:4px 12px;border-radius:6px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:12px;background:rgba(34,197,94,0.15);color:var(--success);border:1px solid rgba(34,197,94,0.3)}
    .vault-count{font-size:14px;font-weight:600;color:var(--text-secondary);white-space:nowrap}
    .vault-card-icon{width:100%;height:220px;display:flex;align-items:center;justify-content:center;background:var(--bg-elevated);border-bottom:1px solid var(--border)}
    .vault-card-icon svg{color:var(--text-secondary);opacity:1}
    .vault-badge-sm{position:absolute;top:12px;right:12px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:6px;letter-spacing:.04em;text-transform:uppercase;z-index:2;background:rgba(34,197,94,0.15);color:#22c55e;border:1px solid rgba(34,197,94,0.3)}
    .vault-badge-sm.locked{background:rgba(239,68,68,0.12);color:#ef4444;border:1px solid rgba(239,68,68,0.3)}
    .vault-card.locked .vault-card-icon{filter:none}

    /* ── Resource card (lesson view) ── */
    .resource-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:18px 20px;display:flex;align-items:center;gap:16px;margin-bottom:12px;transition:var(--transition)}
    .resource-card:hover{border-color:var(--border-hover);background:var(--bg-elevated)}
    .res-open-btn{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#fff;font-size:14px;font-weight:600;padding:10px 20px;border-radius:var(--radius-xs);text-decoration:none;transition:var(--transition);min-height:38px;white-space:nowrap;flex-shrink:0}
    .res-open-btn:hover{background:var(--accent-hover)}
    .resource-card .res-info{flex:1;min-width:0}

    /* ── Upgrade banner ── */
    .upgrade-bar{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px 32px;margin-bottom:64px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
    .upgrade-bar h3{font-weight:600;font-size:17px;color:var(--text-primary);margin-bottom:4px}
    .upgrade-bar p{font-size:15px;color:var(--text-secondary)}

    /* ── Responsive ── */
    @media(max-width:1200px){
      .grid3{grid-template-columns:repeat(2,1fr)}
    }
    @media(max-width:768px){
      header{padding:0 16px;height:56px}
      main{padding:40px 20px}
      .hero h1{font-size:28px}
      .hero-stats{gap:24px}
      .hero-stat-num{font-size:22px}
      .roadmap-card{padding:24px;margin-bottom:40px}
      .grid3{grid-template-columns:1fr;gap:20px;margin-bottom:40px}
      .card-thumb,.card-placeholder{height:180px}
      .block-title{font-size:24px}
      .lesson-title{font-size:24px}
      .coach-list{columns:1}
      .sec-title{font-size:18px}
    }
  </style>
</head>
<body>

<header id="siteHeader">
  <div class="logo">
    <div class="logo-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-secondary)"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></div>
    <div>

      Sign out

  </div>
</header>

<main id="app"></main>

        subtitle:'LinkedIn Script Library - Generating Leads & Booking Appointments',
        body:`## Connection Request Scripts (by Niche)

**Niche: Financial Consultants** — *Target: MSMEs, SMEs, Startups*
> "It took me 5 years to decode how businesses save 50% on taxes and reinvest profits to scale. After many ups and downs, I cracked the formula for smart financial planning that helps MSMEs grow without overspending. Worth a chat if I show you how to boost profits and save big?"

**Niche: Business Coaches** — *Target: SME Owners, Startup Founders, Entrepreneurs*
> "It took me 7 years to refine systems that streamline operations and attract high-ticket clients. After a lot of trial and error, I built a framework that helps business coaches scale sustainably and free up time. Worth a chat if I show you how to grow faster with ease?"

**Niche: Life Coaches** — *Target: Individuals Seeking Personal Development*
> "It took me 4 years to help individuals overcome challenges and create clarity for meaningful growth. After working with many, I developed strategies to turn roadblocks into opportunities for a purposeful life. Worth a chat if I show you how to make breakthroughs happen?"

**Niche: Freelancers Offering Services** — *Target: Other Freelancers*
> "It took me 6 years to figure out how freelancers attract premium clients and avoid burnout. After facing the ups and downs myself, I cracked the method to build a sustainable freelancing business. Worth a chat if I show you how to earn more while working less?"

**Niche: Productivity Coaches** — *Target: Busy Professionals, Entrepreneurs*
> "It took me 3 years to decode what makes professionals double productivity without burning out. After testing and learning, I built frameworks that help coaches achieve big results consistently. Worth a chat if I show you how to scale with less stress?"

**Niche: Social Media Managers** — *Target: Small Business Owners, Influencers, Startups*
> "It took me 5 years to master strategies that grow social media audiences and turn followers into customers. Through trial and error, I built proven methods to scale brand presence and revenue. Worth a chat if I show you how to grow and convert your audience?"

**Niche: Content Writers / Copywriters** — *Target: Business Owners, Marketers*
> "It took me 7 years to decode the psychology of what makes people buy. After refining my process, I cracked how to write copy that connects deeply and converts leads into paying customers. Worth a chat if I show you where your messaging is missing sales?"

**Niche: Career Coaches** — *Target: Professionals Looking for Job Growth*
> "It took me 5 years to help professionals land dream jobs and fast-track promotions. Through hands-on work, I developed strategies to grow careers faster without the guesswork. Worth a chat if I show you how to achieve your next career leap?"

**Niche: Web Developers / Tech Consultants** — *Target: Startups, Founders, SMBs*
> "It took me 4 years to learn how to build MVPs that launch faster and scale smarter. After working with startups, I created systems to deliver products on time and under budget. Worth a chat if I show you how to fast-track your product launch?"

**Niche: Health Coaches** — *Target: Busy Professionals, Fitness Enthusiasts*
> "It took me 6 years to decode how professionals transform health while managing busy lives. After refining my approach, I built methods to help lose weight, gain energy, and stay consistent. Worth a chat if I show you how to hit your health goals effortlessly?"

---

## Follow-Up Scripts

**Message 1 (After Connection Accepted):**
- *Website Designers & Developers:* "Hi [Name], thanks for connecting! Recently, I helped [specific client] redesign their website, boosting their conversion rates by 40%. If you're looking to achieve similar results, I'd love to explore how we can work together."
- *SEO Providers:* "Hi [Name], appreciate the connection! I specialize in helping B2B companies optimize their SEO strategies to rank higher and drive consistent leads. If this aligns with your goals, let's chat!"
- *Career Coaches:* "Hi [Name], I've worked with career coaches to consistently book 30+ high-ticket appointments. One of my clients increased their service price by 3x in just 2 weeks. Let's explore how we can achieve similar results for you!"
- *Financial Consultants:* "Hi [Name], I recently worked with a financial consultant who doubled their client base in 3 months. I'd love to share insights that could help you achieve similar growth. Let's chat!"

**Message 2 (No Response After 1 Week):**
- *General Reminder:* "Hi [Name], just circling back to see if exploring [specific benefit] is something you'd like to discuss. I've seen great results helping [similar industry/niche] overcome [pain point], and I'd love to do the same for you."
- *Business Coaches:* "Hi [Name], I know things can get busy! I'd love to share how I've helped business coaches streamline operations and attract consistent, high-ticket clients. Let me know if this resonates!"

---

## Cold Outreach Script

> "It took me years of working with agencies to understand what drives impactful client engagement and revenue growth. Recently, I helped [specific agency/client] achieve [specific result]. I'd love to explore how we can collaborate to scale your impact."

---

## If They Reply

- **Case Study + Zoom Invite:** "Hi [Name], thank you for replying! Recently, I helped [client/industry] achieve [specific result]. I'm confident we can explore similar strategies for you. How about a quick 15 min chat?"
- **If Unsure:** "Hi [Name], no problem at all! Let me share a free resource that has been invaluable for others in [niche/industry]. If it resonates, we can explore further. Sound good?"

---

## Booking Appointments

- **When Prospect Agrees:** "Great, [Name]! Does [date and time] work for a quick chat? Let me know, and I'll send a calendar invite."
- **If They Disagree:** "No worries! When would be a better time for you?"
- **If They Are Unsure:** "I totally understand! Let me share a resource that might give more clarity on how we can help."

---

## Follow-Up Time

- After 1 Day
- After 5 Days
- After 2 Weeks

---

## Notes

- Personalize each script with specific details about the prospect's profile, company, or goals.
- Keep a sales sheet to track prospects, conversations, and follow-ups.
- Use Google Calendar for scheduling calls instead of relying solely on tools like Calendly.
- Highlight pain points and dream outcomes in your messaging.
- Maintain consistency in follow-ups while respecting the prospect's time.`,

// â”€â”€ ACCESS â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
const T = { basic:1, silver:2, gold:3 };
function canAccess(block) {
  if (!user.converted || !user.tier) return false;
  const ul = T[user.tier] || 0;
  const ml = Math.min(...block.tiers.map(t => T[t]||99));
  if (ul < ml) return false;
  if (block.bumpRequired === 'funnel' && !user.bumpFunnel) return false;
  if (block.bumpRequired === 'prompts' && !user.bumpPrompts) return false;
  if (block.vaultRequired && !user.dfyVault) return false;
  return true;
}

function fmtInline(s) {
  return s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>');
}
function md(s) {
  if (!s) return '';
  let html = '';
  for (const l of s.split('\n')) {
    if (/^## /.test(l))        html += `<h3 class="lc-h2">${fmtInline(l.slice(3))}</h3>`;
    else if (/^> /.test(l))    html += `<blockquote class="lc-bq">${fmtInline(l.slice(2))}</blockquote>`;
    else if (/^- /.test(l))    html += `<span class="lc-li">${fmtInline(l.slice(2))}</span>`;
    else if (/^---$/.test(l.trim())) html += '<hr class="lc-hr"/>';
    else if (l.trim()==='')    html += '<br>';
    else                       html += `<p class="lc-p">${fmtInline(l)}</p>`;
  }
  return html;
}

function render() {
  const hdrBack = document.getElementById('hdrBack');
  const hdrBackLabel = document.getElementById('hdrBackLabel');
  if (state.view === 'dashboard') {
    hdrBack.style.display = 'none';
  } else if (state.view === 'block') {
    hdrBack.style.display = 'flex';
    hdrBackLabel.textContent = 'Back to dashboard';
  } else {
    const block = BLOCKS.find(b => b.id === state.blockId);
    hdrBack.style.display = 'flex';
    hdrBackLabel.textContent = `Back to ${block?.title || 'block'}`;
  }
  const app = document.getElementById('app');
  if (state.view === 'dashboard') app.innerHTML = '<div class="fade-in">' + renderDashboard() + '</div>';
  else if (state.view === 'block') app.innerHTML = '<div class="fade-in">' + renderBlock() + '</div>';
  else app.innerHTML = '<div class="fade-in">' + renderLesson() + '</div>';
  // attach click handlers
  document.querySelectorAll('[data-nav]').forEach(el => {
    el.addEventListener('click', () => {
      const d = el.dataset;
      navigate({ view: d.nav, blockId: d.block || null, lessonId: d.lesson || null });
    });
  });
}

}

function renderLesson() {
  const b = BLOCKS.find(x => x.id === state.blockId);
  const l = b?.lessons?.find(x => x.id === state.lessonId);
  if (!l) return '<p style="padding:40px;color:var(--text-muted)">Lesson not found.</p>';
  const coaches = l.coachList ? `<ul class="coach-list">${l.coachList.map(c=>`<li>${c}</li>`).join('')}</ul>` : '';
  const more = l.moreText ? `<p class="more-text">${l.moreText}</p>` : '';
  const resources = l.resources && l.resources.length > 0
    ? `<div class="res-title">Resources</div>
       ${l.resources.map(r => `
        <div class="resource-card">
          <div class="res-icon">${EXT_SVG}</div>
          <div class="res-info">
            <div class="res-name">${r.name}</div>
          </div>
          <a href="${r.url}" target="_blank" rel="noopener noreferrer" class="res-open-btn">${resBtnLabel(r.url)} ${ARROW}</a>
        </div>`).join('')}`
    : `<div class="res-title">Resources</div><p class="coming-soon">Adding them soon.</p>`;
  return `
    <div class="lesson-wrap">
      <div class="lesson-crumb">${b.title}</div>
      <h1 class="lesson-title">${l.title}</h1>
      ${l.subtitle ? `<p class="lesson-sub">${l.subtitle}</p>` : ''}
      ${l.body ? `<div class="lesson-body">${md(l.body)}</div>` : ''}
      ${coaches}
      ${more}
      ${resources}
    </div>`;
}

render();
</script>
