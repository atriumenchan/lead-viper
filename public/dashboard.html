// â”€â”€ ACCESS â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
const T = { basic:1, silver:2, gold:3 };
function canAccess(block) {
  if (!user.converted || !user.tier) return false;
  const ul = T[user.tier] || 0;
  const ml = Math.min(...block.tiers.map(t => T[t]||99));
  if (ul < ml) return false;
  if (block.bumpRequired === 'funnel' && !user.bumpFunnel) return false;
  if (block.bumpRequired === 'prompts' && !user.bumpPrompts) return false;
  return true;
}

// â”€â”€ STATE â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
let state = { view:'dashboard', blockId:null, lessonId:null };

function navigate(newState) {
  state = newState;
  window.scrollTo(0,0);
  render();
}

function goBack() {
  if (state.view==='lesson') navigate({ view:'block', blockId:state.blockId });
  else navigate({ view:'dashboard' });
}

function signOut() {
  localStorage.removeItem('ailb_user');
  sessionStorage.removeItem('ailb_user');
  window.location.href = '/access';
}

// â”€â”€ SVG HELPERS â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function fmtInline(s) {
  return s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>');
}
function md(s) {
  if (!s) return '';
  let html = '';
  for (const l of s.split('\n')) {
    if (/^## /.test(l))        html += `<h3 class="lc-h2">${fmtInline(l.slice(3))}</h3>`;
    else if (/^> /.test(l))    html += `<blockquote class="lc-bq">${fmtInline(l.slice(2))}</blockquote>`;
    else if (/^- /.test(l))    html += `<span class="lc-li">${fmtInline(l.slice(2))}</span>`;
    else if (/^---$/.test(l.trim())) html += '<hr class="lc-hr"/>';
    else if (l.trim()==='')    html += '<br>';
    else                       html += `<p class="lc-p">${fmtInline(l)}</p>`;
  }
  return html;
}

const ARROW = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>`;

// â”€â”€ RENDER â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function render() {
  const hdrBack = document.getElementById('hdrBack');
  const hdrBackLabel = document.getElementById('hdrBackLabel');
  if (state.view === 'dashboard') {
    hdrBack.style.display = 'none';
  } else if (state.view === 'block') {
    hdrBack.style.display = 'flex';
    hdrBackLabel.textContent = 'Back to dashboard';
  } else {
    const block = BLOCKS.find(b => b.id === state.blockId);
    hdrBack.style.display = 'flex';
    hdrBackLabel.textContent = `Back to ${block?.title || 'block'}`;
  }
  const app = document.getElementById('app');
  if (state.view === 'dashboard') app.innerHTML = renderDashboard();
  else if (state.view === 'block') app.innerHTML = renderBlock();
  else app.innerHTML = renderLesson();
  // attach click handlers
  document.querySelectorAll('[data-nav]').forEach(el => {
    el.addEventListener('click', () => {
      const d = el.dataset;
      navigate({ view: d.nav, blockId: d.block || null, lessonId: d.lesson || null });
    });
  });
}

function renderDashboard() {
  const core = BLOCKS.filter(b => b.type==='core');
  const bonuses = BLOCKS.filter(b => b.type==='bonus');
  const hasLocked = BLOCKS.some(b => !canAccess(b));
  return `
    <div class="welcome">
      <h1>Welcome back, ${user.firstName || 'there'} &#128075;</h1>
      <p>Pick a block below and start learning.</p>
    </div>
    ${hasLocked ? `<div class="upgrade-bar"><div><h3>&#128274; Unlock More Content</h3><p>Upgrade your plan to access all blocks and bonuses.</p></div><a href="https://leadengine.admexo.com" class="up-btn">Upgrade Now &#8594;</a></div>` : ''}
    <div class="sec-title">${STAR} Core Blocks</div>
    <div class="grid3">${core.map(b => cardHtml(b)).join('')}</div>
    <div class="sec-title">${CROWN} Bonuses</div>
    <div class="grid3">${bonuses.map(b => cardHtml(b)).join('')}</div>`;
}

function cardHtml(b) {
  const ok = canAccess(b);
  const imgTag = b.img ? '<img src="' + b.img + '" alt="' + b.title + '" loading="lazy">' : '';
  const fallback = b.img ? '' : '<svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#661fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="position:relative;z-index:1;opacity:.75"><polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>';
  const badge = ok ? (b.type==='bonus' ? '<span class="card-badge">BONUS</span>' : '') : '<span class="card-badge locked-badge">&#128274; Locked</span>';
  const ctaText = ok ? 'Open block &#8594;' : 'Upgrade to unlock';
  return '<div class="card' + (ok ? '' : ' locked') + '" ' + (ok ? 'data-nav="block" data-block="' + b.id + '"' : '') + '>' +
    '<div class="card-thumb ' + b.bg + '">' + imgTag + fallback + badge + '</div>' +
    '<div class="card-body">' +
    '<div class="card-title' + (ok && b.type==='bonus' ? ' amber' : '') + '">' + b.title + '</div>' +
    '<div class="card-desc">' + b.desc + '</div>' +
    '<div class="card-cta' + (ok ? '' : ' dim') + '">' + ctaText + (ok ? ' ' + ARROW : '') + '</div>' +
    '</div></div>';
}

function renderBlock() {
  const b = BLOCKS.find(x => x.id === state.blockId);
  if (!b) return '<p style="padding:40px;color:#6b7280">Block not found.</p>';
  const lessons = b.lessons || [];
  return `
    <div class="block-header">
      <div class="block-crumb">${FOLDER_SVG} Course Block</div>
      <h1 class="block-title">${b.title}</h1>
      <p class="block-sub">${b.desc}</p>
      <div class="folder-count">${FOLDER_SVG} ${lessons.length} Folders</div>
    </div>
    ${lessons.length === 0 ? '<p class="coming-soon">Content coming soon â€” links will be added here.</p>' : ''}
    <div class="folder-grid">
      ${lessons.map(l => `
        <div class="folder-card" data-nav="lesson" data-block="${b.id}" data-lesson="${l.id}">
          <div class="folder-icon">${FOLDER_SVG}</div>
          <div class="folder-name">${l.title}</div>
        </div>`).join('')}
    </div>`;
}

function renderLesson() {
  const b = BLOCKS.find(x => x.id === state.blockId);
  const l = b?.lessons?.find(x => x.id === state.lessonId);
  if (!l) return '<p style="padding:40px;color:#6b7280">Lesson not found.</p>';
  const coaches = l.coachList ? `<ul class="coach-list">${l.coachList.map(c=>`<li>${c}</li>`).join('')}</ul>` : '';
  const more = l.moreText ? `<p class="more-text">${l.moreText}</p>` : '';
  const resources = l.resources && l.resources.length > 0
    ? `<div class="res-title">${EXT_SVG} Resources</div>
       ${l.resources.map(r => `
        <a href="${r.url}" target="_blank" rel="noopener noreferrer" class="resource-card">
          <div class="res-icon">${EXT_SVG}</div>
          <div class="res-info">
            <div class="res-name">${r.name}</div>
            <div class="res-url">${r.url}</div>
          </div>
        </a>`).join('')}`
    : `<div class="res-title">${EXT_SVG} Resources</div><p class="coming-soon">Resource links will be added here soon.</p>`;
  return `
    <div class="lesson-wrap">
      <div class="lesson-crumb">${FOLDER_SVG} ${b.title}</div>
      <h1 class="lesson-title">${l.title}</h1>
      ${l.subtitle ? `<p class="lesson-sub">${l.subtitle}</p>` : ''}
      ${l.body ? `<div class="lesson-body">${md(l.body)}</div>` : ''}
      ${coaches}
      ${more}
      ${resources}
    </div>`;
}
