<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — AI Lead Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #07070f; --panel: #0f0f1f; --panel2: #13131f; --border: #1f2030;
      --text: #e7e8f0; --muted: #8b8fa3;
      --purple: #661fff; --purple2: #4c1fb3; --purple-glow: rgba(102,31,255,.35);
      --red: #ff4d5e;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; padding: 24px;
    }
    .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
    .logo-icon {
      width: 42px; height: 42px; border-radius: 11px;
      background: linear-gradient(135deg, #6f2bff, #4c1fb3);
      display: flex; align-items: center; justify-content: center;
      font-size: 21px; color: #fff;
    }
    .logo-text { font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 16px; color: #fff; line-height: 1.2; }
    .logo-sub { font-size: 10px; font-weight: 600; color: var(--purple); letter-spacing: .1em; text-transform: uppercase; }
    .login-card {
      width: 100%; max-width: 400px;
      background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
      padding: 36px 32px;
    }
    .login-card h1 {
      font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 21px;
      color: #fff; text-align: center; margin-bottom: 4px;
    }
    .login-sub { font-size: 13px; color: var(--muted); text-align: center; margin-bottom: 26px; }
    .error {
      display: none;
      background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.25);
      border-radius: 8px; padding: 10px 14px; font-size: 13px;
      color: #fca5a5; margin-bottom: 16px; text-align: center;
    }
    .error.show { display: block; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 12px; font-weight: 600; color: #c7c9d6; margin-bottom: 6px; }
    .field input {
      width: 100%; padding: 12px 14px; background: #0b0b16;
      border: 1px solid #2a2b3d; border-radius: 9px;
      color: #fff; font-size: 14px; outline: none; transition: border-color .2s;
    }
    .field input:focus { border-color: var(--purple); }
    .field input::placeholder { color: #5a5c70; }
    .login-btn {
      width: 100%; padding: 13px;
      background: linear-gradient(135deg, #6f2bff, #4c1fb3);
      color: #fff; font-family: 'Montserrat', sans-serif; font-weight: 800;
      font-size: 14px; border: none; border-radius: 9px;
      cursor: pointer; transition: opacity .2s; margin-top: 8px;
    }
    .login-btn:hover { opacity: .9; }
    .login-btn:disabled { opacity: .5; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="logo">
    <div class="logo-icon">&#9889;</div>
    <div>
      <div class="logo-text">AI Lead Engine</div>
      <div class="logo-sub">Admin Console</div>
    </div>
  </div>

  <div class="login-card">
    <h1>Admin Login</h1>
    <p class="login-sub">Sign in to view roadmap requests & manage the engine</p>
    <div class="error" id="login-error"></div>
    <form id="login-form" autocomplete="off">
      <div class="field">
        <label>Email</label>
        <input type="email" id="email" placeholder="admin@admexo.com" required autofocus />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••" required />
      </div>
      <button type="submit" class="login-btn" id="login-btn">Sign In</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const btn = document.getElementById('login-btn');
    const errEl = document.getElementById('login-error');
    const params = new URLSearchParams(window.location.search);
    const redirectTo = params.get('to') || '/admin';

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btn.disabled = true; btn.textContent = 'Authenticating…';
      errEl.classList.remove('show'); errEl.textContent = '';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
          }),
        });

        const data = await res.json();

        if (!res.ok) {
          errEl.textContent = data.error || 'Invalid credentials';
          errEl.classList.add('show');
          btn.disabled = false; btn.textContent = 'Sign In';
          return;
        }

        if (data.token) { localStorage.setItem('admin_token', data.token); }
        window.location.href = redirectTo;
      } catch {
        errEl.textContent = 'Connection error — try again';
        errEl.classList.add('show');
        btn.disabled = false; btn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
